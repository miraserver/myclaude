name: Release codeagent-wrapper

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Run script tests
        shell: bash
        run: |
          unset CLAUDE_PROJECT_DIR
          node --test tests/cli.test.js
          python -m pytest tests -q
          python -m pytest skills -q

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        run: |
          cd codeagent-wrapper
          go test -timeout 20m -v -cover -coverprofile=coverage.out ./...
        shell: bash

      - name: Check coverage
        run: |
          cd codeagent-wrapper
          go tool cover -func=coverage.out | grep total | awk '{print $3}'
        shell: bash

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        id: build
        working-directory: codeagent-wrapper
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          OUTPUT_NAME=codeagent-wrapper-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -ldflags="-s -w -X codeagent-wrapper/internal/app.version=${VERSION}" -o ${OUTPUT_NAME} ./cmd/codeagent-wrapper
          chmod +x ${OUTPUT_NAME}
          echo "artifact_path=codeagent-wrapper/${OUTPUT_NAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeagent-wrapper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.artifact_path }}

  release:
    name: Create Release
    needs: [test, scripts, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_TAG" >&2
            exit 1
          fi
          node -e 'const expected = require("./package.json").version; const check = value => { if (!value || typeof value !== "object") return; for (const [key, entry] of Object.entries(value)) { if (key === "version" && entry !== expected) throw new Error(`Marketplace version ${JSON.stringify(entry)} does not match package version ${expected}`); check(entry); } }; check(require("./.claude-plugin/marketplace.json"));'

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating notes from $PREVIOUS_TAG to ${{ github.ref_name }}"
            COMMITS=$(git log ${PREVIOUS_TAG}..${{ github.ref_name }} --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create release notes
          cat > release_notes.md <<EOF
          ## What's Changed

          ${COMMITS}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }}
          EOF

          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "codeagent-wrapper-*" -exec mv {} release/ \;
          cp install.sh install.bat release/
          (cd release && sha256sum --text codeagent-wrapper-* install.sh install.bat > SHA256SUMS)
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: false

  withdraw:
    name: Withdraw release after smoke failure
    needs: [smoke]
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Return failed release to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=true -R "$GITHUB_REPOSITORY"
          echo "Post-release smoke failed; release $GITHUB_REF_NAME has been returned to draft." >&2
          exit 1

  smoke:
    name: Post-release smoke (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CODEAGENT_WRAPPER_VERSION: ${{ github.ref_name }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - name: Install published Unix release and verify version
        if: runner.os != 'Windows'
        shell: bash
        env:
          INSTALL_DIR: ${{ runner.temp }}/codeagent-smoke
          SKIP_WARNING: '1'
        run: |
          set -euo pipefail
          curl -fSL --retry 3 "$RELEASE_URL/install.sh" -o "$RUNNER_TEMP/install.sh"
          export PATH="$INSTALL_DIR/bin:$PATH"
          bash "$RUNNER_TEMP/install.sh" 2>&1 | tee "$RUNNER_TEMP/install.log"
          if grep -Ei 'warning|error' "$RUNNER_TEMP/install.log"; then
            echo "Installer reported a warning or error" >&2
            exit 1
          fi
          "$INSTALL_DIR/bin/codeagent-wrapper" --version > "$RUNNER_TEMP/version.log" 2>&1
          cat "$RUNNER_TEMP/version.log"
          grep -F -- "$CODEAGENT_WRAPPER_VERSION" "$RUNNER_TEMP/version.log"

      - name: Install published Windows release and verify version
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          curl -fSL --retry 3 "%RELEASE_URL%/install.bat" -o "%RUNNER_TEMP%\install.bat"
          if errorlevel 1 exit /b 1
          set "USERPROFILE=%RUNNER_TEMP%\codeagent-smoke"
          mkdir "%USERPROFILE%"
          if errorlevel 1 exit /b 1
          cmd /d /c call "%RUNNER_TEMP%\install.bat" > "%RUNNER_TEMP%\install.log" 2>&1
          if errorlevel 1 (
            type "%RUNNER_TEMP%\install.log"
            exit /b 1
          )
          type "%RUNNER_TEMP%\install.log"
          findstr /I /C:"WARNING" /C:"ERROR" "%RUNNER_TEMP%\install.log" >nul
          if not errorlevel 1 exit /b 1
          "%USERPROFILE%\bin\codeagent-wrapper.exe" --version > "%RUNNER_TEMP%\version.log" 2>&1
          if errorlevel 1 (
            type "%RUNNER_TEMP%\version.log"
            exit /b 1
          )
          type "%RUNNER_TEMP%\version.log"
          findstr /L /C:"%CODEAGENT_WRAPPER_VERSION%" "%RUNNER_TEMP%\version.log"
          if errorlevel 1 exit /b 1

      - name: Smoke test published npx installer entry points
        shell: bash
        run: |
          set -euo pipefail
          smoke_home="$RUNNER_TEMP/npx-smoke-home"
          mkdir -p "$smoke_home"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export USERPROFILE="$(cygpath -w "$smoke_home")"
          else
            export USERPROFILE="$smoke_home"
          fi
          export HOME="$smoke_home"
          npx -y "github:${{ github.repository }}#${{ github.ref_name }}" --tag "${{ github.ref_name }}" --list > "$RUNNER_TEMP/npx-github.log" 2>&1
          cat "$RUNNER_TEMP/npx-github.log"
          grep -F "module:do" "$RUNNER_TEMP/npx-github.log"
          npx -y "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${{ github.ref_name }}" --help > "$RUNNER_TEMP/npx-tarball.log" 2>&1
          cat "$RUNNER_TEMP/npx-tarball.log"
          grep -F "myclaude" "$RUNNER_TEMP/npx-tarball.log"
